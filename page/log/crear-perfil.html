<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crear perfil</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="grid-container">
    <header class="header">
        <a href="../../index.html"><img  class="logo" src="../../assets/identidad/img-marca.svg" alt="Icono de la tienda" ></a>
        <nav class="nadvar"> 
            <div class="cate-nav">
                <a class="cate-nav--a" href="../../index.html">Home</a>
                <a class="cate-nav--a" href="../Indumentaria.html">Indumentaria</a>
                <a class="cate-nav--a" href="../calzados.html">Calzado</a>
                <a class="cate-nav--a" href="../accesorios.html">Accesorios</a>
            </div>
            <div class="style-vinculo">
            <a class="style-vinculo--log" href="./page/crear-perfil.html" >Inicio de sesion</a>
            <!-- <a class="style-vinculo--log" href="./page/crear-perfil.html" >Nuevo perfil</a> -->
            </div>
        </nav>
        </header>
    <main class="main-crearperfil">
        <div class="cards">
            <div class="card-formulario"> 
                <form action="" method="post">
                        <h2 class="title">Crear sesion</h2>
                        <div class="rows">
                            <label class=font for="nombre">Nombre</label>
                            <input type="text" id="nombre"  name="nomb" required>     
                        </div>
                        <div class="rows">
                            <label class=font for="apellido">Apellido</label> 
                            <input type="text" id="apellido" name="apell" required>
                        </div>
                        <div class="rows">
                            <label  class=font for="email">Email</label>
                            <input type="email" id="email" name="em" required>
                        </div>
                        <div class="rows">
                            <label  class=font for="Ciudad">Cuidad</label>
                        <select id="Ciudad" name="Prov" required>
                            <option value="" disabled selected>Seleccione una opcion</option>
                            <option value="Cordoba">Córdoba</option>
                            <option value="Buenos Aires">Buenos Aires</option>
                            <option value="Santa Fe">Santa Fe</option>
                            <option value="Rio Negro">Rio Negro</option>
                            <option value="Chubut">Chubut</option>
                            <option value="Tierra del fuego">Tierra del fuego</option>
                            <option value="Mendoza">Mendoza</option>
                            <option value="Neuquen">Neuquen</option>
                            <option value="Chaco">Chaco</option>
                            <option value="Formosa">Formosa</option>
                        </select>  
                        </div>
                        <div class="rows">
                            <label  class=font for="Fecha_Nacimiento">Fecha de nacimiento</label>
                            <input type="date" id="Fecha_Nacimiento" name="datenac" required>
                        </div>
                        <div class="rows">
                            <label class=font for="contraseña">Crear contraseña</label>
                            <input type="password" name="pas" id="contraseña" placeholder="***************" required>
                        </div>
                        <div class="rows">
                            <label class=font for="contraseñad">Repetir contraseña</label>
                            <input type="password" name="pas" id="contraseñad" placeholder="***************" required>
                        </div>
                        <div class="rows">
                        <label class=font for="checkbox">Subcripcion a nuestras ofertar</label>   
                        <input type="checkbox" name="chek" id="checkbox">
                        </div>
                        <div class="rows">
                            <button class=boton type="submit">Crear nuevo perfil</button> 
                        </div>
                </form>
            </div>    
        </div>
    </main>
    <footer class="footer">
        <div class="cont-footer"> 
            <div> 
                <h4 class="h4-style">Vértigo</h4> 
                <p class="p-footer">Moda urbana con identidad propia.</p> 
            </div> 
            <div> 
                <h4 class="h4-style">Navegación</h4>
                <p class="p-footer"><a href="index.html">Home</a></p> 
            </div> 
            <div> 
                <h4 class="h4-style">Contacto</h4>
                <p class="p-footer">Bialet Massé, Córdoba</p> 
            </div> 
        </div> 
        <div class="logo-contenedor">
            <a href="../../index.html"><img  class="logo-footer"src="../../assets/identidad/img-marca.svg" alt=""></a>
        </div>
    </footer>
    </div>  
</body>
</html>
