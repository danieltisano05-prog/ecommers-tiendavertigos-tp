<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crear perfil</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="grid-container">
    <header class="header">
        <a href="../../index.html"><img  class="logo" src="../../assets/identidad/img-marca.svg" alt="Icono de la tienda" ></a>
        <nav class="nadvar"> 
            <div class="cate-nav">
                <a class="cate-nav--a" href="../../index.html">Home</a>
                <a class="cate-nav--a" href="../Indumentaria.html">Indumentaria</a>
                <a class="cate-nav--a" href="../calzados.html">Calzado</a>
                <a class="cate-nav--a" href="../accesorios.html">Accesorios</a>
            </div>
            <div class="style-vinculo">
            <a class="style-vinculo--log" href="./page/crear-perfil.html" >Inicio de sesion</a>
            <!-- <a class="style-vinculo--log" href="./page/crear-perfil.html" >Nuevo perfil</a> -->
            </div>
        </nav>
        </header>
    <main class="main-crear-inicar "> 
        <div class="cards-sesion">
            <div class="card-formulario"> 
                <form action="" method="post">
                    <h2 class="title">Crear sesión</h2>

                    <div class="rows">
                        <label class="font" for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nomb" required placeholder="Daniel">     
                    </div>

                    <div class="rows">
                        <label class="class-label font" for="apellido">Apellido</label> 
                        <input type="text" id="apellido" name="apell" required placeholder="Tisano">
                    </div>

                    <div class="rows">
                        <label class="font" for="email">Email</label>
                        <input type="email" id="email" name="em" required placeholder="ejemplo@correo.com">
                    </div>

                    <div class="rows">
                        <label class="font" for="ciudad">Ciudad</label>
                        <select id="ciudad" name="Prov" required>
                            <option value="" disabled selected>Seleccione una opción</option>
                            <option value="Cordoba">Córdoba</option>
                            <option value="Buenos Aires">Buenos Aires</option>
                            <option value="Santa Fe">Santa Fe</option>
                            <option value="Rio Negro">Río Negro</option>
                            <option value="Chubut">Chubut</option>
                            <option value="Tierra del fuego">Tierra del Fuego</option>
                            <option value="Mendoza">Mendoza</option>
                            <option value="Neuquen">Neuquén</option>
                            <option value="Chaco">Chaco</option>
                            <option value="Formosa">Formosa</option>
                        </select>  
                    </div>

                    <div class="rows">
                        <label class="font" for="fecha-nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fecha-nacimiento" name="datenac" required>
                    </div>

                    <div class="rows">
                        <label class="font" for="contrasena">Crear contraseña</label>
                        <input type="password" name="pas" id="contrasena" placeholder="***************" required>
                    </div>

                    <div class="rows">
                        <label class="font" for="contrasenad">Repetir contraseña</label>
                        <input type="password" name="pas_confirm" id="contrasenad" placeholder="***************" required>
                    </div>

                    <!-- Fila especial para el Checkbox -->
                    <div class="rows rows-checkbox">
                        <input type="checkbox" name="chek" id="suscripcion">
                        <label class="font" for="suscripcion">Suscripción a nuestras ofertas</label>   
                    </div>

                    <!-- Fila especial para el Botón -->
                    <div class="rows-boton">
                        <button class="boton" type="submit">Crear nuevo perfil</button> 
                    </div>
                </form>
            </div>    
        </div>
    </main>
    <footer class="footer">
        <div class="cont-footer"> 
            <div> 
                <h4 class="h4-style">Vértigo</h4> 
                <p class="p-footer">Moda urbana con identidad propia.</p> 
            </div> 
            <div> 
                <h4 class="h4-style">Navegación</h4>
                <p class="p-footer"><a href="index.html">Home</a></p> 
            </div> 
            <div> 
                <h4 class="h4-style">Contacto</h4>
                <p class="p-footer">Bialet Massé, Córdoba</p> 
            </div> 
        </div> 
        <div class="logo-contenedor">
            <a href="../../index.html"><img  class="logo-footer"src="../../assets/identidad/img-marca.svg" alt=""></a>
        </div>
    </footer>
    </div>  
</body>
</html>
